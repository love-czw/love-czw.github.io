<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111613">
  <meta name="description" content="愚蠢的博弈游戏。手牌公开，行动暗选。选一张牌，和邪恶的小北较量。">
  <title>愚蠢的博弈游戏</title>
  <link rel="icon" type="image/png" href="assets/shield-strike.png">
  <link rel="stylesheet" href="lobby.css?v=lobby-2">
  <script src="lobby.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="frame topbar-inner">
      <div class="wordmark">
        <span class="seal" aria-hidden="true"></span>
        <span lang="en">STUPID<br>MIND GAMES</span>
      </div>
      <button class="rules-button" type="button" data-dialog="rules">玩法说明</button>
    </div>
  </header>

  <main class="frame lobby">
    <section class="hero" aria-labelledby="game-title">
      <div class="hero-content">
        <h1 id="game-title"><span>愚蠢的</span><span>博弈游戏</span></h1>
        <p>看得见手牌，猜不透下一手。</p>
      </div>
    </section>

    <section class="modes" aria-labelledby="modes-title">
      <h2 id="modes-title">选择模式</h2>
      <div class="mode-grid">
        <a class="mode mode-ai" href="battle.html?v=epic-3" aria-labelledby="ai-label" aria-describedby="ai-detail">
          <span class="mode-art"></span>
          <span class="mode-status"><i aria-hidden="true"></i>可游玩</span>
          <span class="mode-copy">
            <strong id="ai-label">人机对战</strong>
            <span id="ai-detail">挑战邪恶的小北</span>
          </span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </a>
        <button class="mode mode-duel" type="button" data-dialog="duel"
                aria-labelledby="duel-label" aria-describedby="duel-status">
          <span class="mode-art"></span>
          <span class="mode-status" id="duel-status">筹备中</span>
          <span class="mode-copy">
            <strong id="duel-label">双人对战</strong>
            <span>与好友较量</span>
          </span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="mode mode-tower" type="button" data-dialog="tower"
                aria-labelledby="tower-label" aria-describedby="tower-status">
          <span class="mode-art"></span>
          <span class="mode-status" id="tower-status">筹备中</span>
          <span class="mode-copy">
            <strong id="tower-label">爬塔</strong>
            <span>逐层闯关</span>
          </span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </button>
        <button class="mode mode-boss" type="button" data-dialog="boss"
                aria-labelledby="boss-label" aria-describedby="boss-status">
          <span class="mode-art"></span>
          <span class="mode-status" id="boss-status">筹备中</span>
          <span class="mode-copy">
            <strong id="boss-label">限时 Boss</strong>
            <span>挑战巨像</span>
          </span>
          <span class="mode-arrow" aria-hidden="true">↗</span>
        </button>
      </div>
    </section>
  </main>

  <dialog id="lobby-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-description">
    <div class="dialog-art" aria-hidden="true"></div>
    <div class="dialog-body">
      <h2 id="dialog-title"></h2>
      <p id="dialog-description"></p>
      <form method="dialog">
        <button class="rules-button" type="submit" autofocus>关闭</button>
      </form>
    </div>
  </dialog>
</body>
</html>
