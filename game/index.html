<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101714">
  <meta name="description" content="愚蠢的博弈游戏是一款回合制人机卡牌游戏。看见对手的牌，再猜它下一手怎么打。">
  <title>愚蠢的博弈游戏</title>
  <link rel="stylesheet" href="styles.css">
  <script defer src="app.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="masthead-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i></span>
        <div>
          <h1>愚蠢的博弈游戏</h1>
          <p lang="en">STUPID MIND GAMES</p>
        </div>
      </div>
      <div class="header-actions">
        <button class="button button-quiet" id="show-rules" type="button">玩法</button>
        <button class="button button-outline" id="restart" type="button" disabled>重开对局</button>
      </div>
    </div>
  </header>

  <main class="game-layout">
    <section class="board" id="board" aria-label="卡牌战场" data-phase="loading">
      <section class="fighter fighter-computer" aria-labelledby="computer-title">
        <div class="fighter-profile">
          <h2 id="computer-title">电脑</h2>
          <div id="computer-stats" class="fighter-stats"></div>
        </div>
        <div id="computer-hand" class="hand opponent-hand" aria-label="电脑手牌"></div>
      </section>

      <section class="arena" aria-label="对战区">
        <div class="pile-area">
          <div class="pile">
            <span class="pile-stack" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="pile-number" id="draw-count">—</span>
            <span class="pile-label">抽牌堆</span>
          </div>
        </div>
        <div class="arena-center">
          <div class="turn-label" id="turn-label" hidden></div>
          <h2 id="phase-title" aria-live="polite">准备对局</h2>
          <p id="phase-detail" class="phase-detail">正在载入对局。</p>
          <button type="button" id="pass" class="button button-pass" hidden>跳过出牌</button>
          <button type="button" id="play-again" class="button button-primary" hidden>再开一局</button>
          <button type="button" id="retry" class="button button-outline" hidden>重新载入</button>
        </div>
        <div class="pile-area">
          <div class="pile pile-discard">
            <span class="pile-stack" aria-hidden="true"><i></i><i></i><i></i></span>
            <span class="pile-number" id="discard-count">—</span>
            <span class="pile-label">弃牌堆</span>
          </div>
        </div>
      </section>

      <section class="fighter fighter-player" aria-labelledby="player-title">
        <div class="fighter-profile">
          <h2 id="player-title">你</h2>
          <div id="player-stats" class="fighter-stats"></div>
        </div>
        <div id="player-hand" class="hand player-hand" aria-label="你的手牌"></div>
      </section>
    </section>

    <aside class="journal" aria-labelledby="journal-title">
      <div class="journal-head">
        <h2 id="journal-title">对局记录</h2>
        <span class="journal-mark" aria-hidden="true"></span>
      </div>
      <div id="journal-scroll" class="journal-scroll">
        <ol class="journal-events" id="journal-events" aria-live="polite" aria-relevant="additions"></ol>
      </div>
      <p class="notice" id="notice" role="status" hidden></p>
    </aside>
  </main>

  <dialog id="rules">
    <div class="rules-head">
      <h2>玩法</h2>
      <form method="dialog">
        <button class="button button-quiet" type="submit">关闭</button>
      </form>
    </div>
    <p>双方各 24 点血、4 点初始蓝，并公开手牌。每回合选一张牌或跳过。回合结束回 1 蓝、摸 1 张，超过 6 张就选牌弃掉。</p>
    <p>蓝量上限 7，护盾先吸收伤害。牌堆摸空时，洗回弃牌堆。先把对手打到 0 血就赢。</p>
    <div class="rules-list" id="rules-list"></div>
    <a class="credit-link" href="assets/素材来源.md">查看美术素材来源</a>
  </dialog>
</body>
</html>
